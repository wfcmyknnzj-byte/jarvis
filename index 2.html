<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#05070c;color:#e8f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{max-width:520px;min-height:100vh;margin:auto;padding:28px 16px 22px;display:flex;flex-direction:column}
.header{text-align:center;letter-spacing:4px;font-weight:700;font-size:22px}
.sub{text-align:center;color:#6e8796;font-size:10px;letter-spacing:3px;margin-top:5px}
.core{width:190px;height:190px;margin:45px auto 22px;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#18384a 0,#0b1720 42%,#05070c 70%);box-shadow:0 0 25px #16769a66,inset 0 0 35px #0c7da533}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;border:1px solid #4fc3f755}
.core:before{inset:12px}
.core:after{inset:28px;border-style:dashed;animation:spin 12s linear infinite}
.eye{width:34px;height:34px;border-radius:50%;background:#bcefff;box-shadow:0 0 20px #5ddcff,0 0 45px #199bc8;animation:pulse 2s infinite}
.listening .eye{box-shadow:0 0 35px #8eeeff,0 0 75px #2ed7ff;transform:scale(1.25)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.82);opacity:.7}}
.status{text-align:center;color:#83a8b8;font-size:13px;margin-bottom:18px}
.status b{color:#bdeeff}
.log{background:#0a0f16;border:1px solid #162b36;border-radius:16px;padding:13px;min-height:125px;max-height:245px;overflow:auto}
.msg{margin:9px 0;font-size:14px;line-height:1.45}
.you{color:#9bdcff}.jarvis{color:#dfeaf0}
.controls{display:flex;gap:8px;margin-top:12px}
.input{min-width:0;flex:1;background:#0a0f16;color:white;border:1px solid #1c3542;border-radius:14px;padding:14px;outline:none;font-size:15px}
.btn{border:0;border-radius:14px;background:#143b4b;color:white;padding:0 15px;font-size:15px}
.mic{margin-top:11px;width:100%;height:54px;border-radius:15px;border:1px solid #1d6378;background:#0b2029;color:#bfefff;font-size:16px}
.switch{margin-top:12px;display:flex;justify-content:space-between;align-items:center;background:#0a0f16;border:1px solid #162b36;border-radius:14px;padding:12px 14px;color:#90a9b5;font-size:12px}
.switch input{width:20px;height:20px}
.footer{text-align:center;color:#506673;font-size:11px;margin-top:auto;padding-top:20px}
</style>
</head>
<body>
<main class="app" id="app">
<div class="header">J.A.R.V.I.S.</div>
<div class="sub">PERSONAL AI ASSISTANT • V2</div>
<div class="core"><div class="eye"></div></div>
<div class="status" id="status">● <b>HAZIR</b></div>
<div class="log" id="log"><div class="msg jarvis"><b>Jarvis:</b> Merhaba. Sesli komut için hazırım.</div></div>
<div class="controls">
<input class="input" id="input" placeholder="Jarvis'e bir şey söyle...">
<button class="btn" onclick="send()">Gönder</button>
</div>
<button class="mic" onclick="listen()">🎙️ Konuş ve Dinle</button>
<label class="switch"><span>🔊 Jarvis sesli cevap versin</span><input id="voice" type="checkbox" checked></label>
<div class="footer">V2 • Ses tanıma + sesli cevap • Gerçek AI bağlantısı sonraki adım</div>
</main>
<script>
const log=document.getElementById('log'),input=document.getElementById('input'),status=document.getElementById('status'),app=document.getElementById('app');
function add(who,text,cls){
  log.innerHTML+=`<div class="msg ${cls}"><b>${who}:</b> ${text}</div>`;
  log.scrollTop=log.scrollHeight;
}
function speak(text){
  if(!document.getElementById('voice').checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(text);
  u.lang='tr-TR'; u.rate=.95; u.pitch=.95;
  speechSynthesis.speak(u);
}
function brain(t){
  let x=t.toLowerCase(),r='Bunu anladım. Gerçek yapay zekâ beynini bir sonraki adımda güvenli sunucuya bağlayacağız.';
  if(x.includes('merhaba')||x.includes('selam')) r='Merhaba. Seni dinliyorum.';
  else if(x.includes('nasılsın')) r='Gayet iyiyim. Sistemlerim hazır.';
  else if(x.includes('kimsin')) r='Ben geliştirdiğimiz kişisel Jarvis asistanıyım.';
  else if(x.includes('test')) r='Sesli yanıt sistemim çalışıyor.';
  add('Jarvis',r,'jarvis'); speak(r);
}
function send(){
  let t=input.value.trim();
  if(!t)return;
  add('Sen',t,'you');
  input.value='';
  brain(t);
}
function listen(){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){alert('Bu tarayıcı ses tanımayı desteklemiyor.');return}
  const rec=new R();
  rec.lang='tr-TR'; rec.interimResults=false; rec.maxAlternatives=1;
  status.innerHTML='● <b>DİNLİYORUM...</b>';
  app.classList.add('listening');
  rec.start();
  rec.onresult=e=>{input.value=e.results[0][0].transcript;send()};
  rec.onerror=()=>{
    add('Jarvis','Sesini anlayamadım. Tekrar deneyebiliriz.','jarvis');
    status.innerHTML='● <b>HAZIR</b>';
  };
  rec.onend=()=>{
    status.innerHTML='● <b>HAZIR</b>';
    app.classList.remove('listening');
  };
}
input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
