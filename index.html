<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
:root{--bg:#05070c;--panel:#0a0f16;--line:#162b36;--text:#e8f6ff;--muted:#6e8796;--glow:#8eeeff}
body{margin:0;background:radial-gradient(circle at 50% 18%,#0b1b26 0,#05070c 34%,#05070c 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.app{width:min(720px,100%);min-height:100vh;margin:auto;padding:22px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
header{text-align:center;letter-spacing:5px}
h1{margin:4px 0 4px;font-size:24px}
.sub{text-align:center;color:#6e8796;font-size:12px;letter-spacing:3px}
.core{width:190px;height:190px;margin:34px auto 22px;position:relative;border-radius:50%;display:grid;place-items:center}
.core:before,.core:after{content:"";position:absolute;border-radius:50%;inset:12px;border:1px solid #315363;box-shadow:0 0 30px #214454}
.core:after{inset:28px;border-style:dashed;animation:spin 14s linear infinite}
.eye{width:48px;height:48px;border-radius:50%;background:#14384b;box-shadow:0 0 12px #8eeeff,0 0 45px #3f9fc0;animation:pulse 2s ease-in-out infinite}
.status{text-align:center;color:#83a8b8;font-size:14px;margin-bottom:14px}
.status b{color:#bdeeff}
.log{background:#0a0f16;border:1px solid #162b36;border-radius:16px;padding:10px;min-height:130px;max-height:45vh;overflow:auto}
.msg{margin:9px 0;font-size:14px;line-height:1.5;white-space:pre-wrap}
.you{color:#9bdcff}.jarvis{color:#dfeaf0}
.controls{display:flex;gap:8px;margin-top:10px}
input{min-width:0;flex:1;background:#0a0f16;color:#e8f6ff;border:1px solid #1b3643;border-radius:14px;padding:14px;font-size:15px;outline:none}
button{border:0;border-radius:14px;background:#143548;color:#e8f6ff;padding:0 18px;font-weight:700;font-size:15px}
button:active{transform:scale(.98)}
.mic{margin-top:10px;width:100%;height:54px;border:1px solid #244a5d;background:#0b1821}
.switch{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;color:#718997;font-size:13px}
.switch input{width:20px;height:20px}
footer{text-align:center;color:#506673;font-size:11px;margin-top:auto;padding-top:18px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.82);opacity:.7}}
</style>
</head>
<body>
<div class="app">
<header><h1>J.A.R.V.I.S.</h1><div class="sub">PERSONAL AI ASSISTANT</div></header>
<div class="core"><div class="eye"></div></div>
<div class="status" id="status">● <b>HAZIR</b></div>
<div class="log" id="log"><div class="msg jarvis"><b>JARVIS:</b> Merhaba. Ben hazırım. Bana bir şey sorabilirsin.</div></div>
<div class="controls"><input id="input" autocomplete="off" placeholder="JARVIS'e bir şey sor..."><button id="send">Gönder</button></div>
<button class="mic" id="mic">🎙️ Mikrofonu Başlat</button>
<label class="switch"><input type="checkbox" id="speak" checked> Cevapları sesli oku</label>
<footer>J.A.R.V.I.S. • Netlify + OpenAI</footer>
</div>
<script>
const log=document.getElementById("log"),input=document.getElementById("input"),send=document.getElementById("send"),mic=document.getElementById("mic"),status=document.getElementById("status"),speak=document.getElementById("speak");
let messages=[],recognition=null;

function add(role,text){
const div=document.createElement("div");
div.className="msg "+(role==="user"?"you":"jarvis");
div.innerHTML="<b>"+(role==="user"?"SEN":"JARVIS")+":</b> "+escapeHtml(text);
log.appendChild(div);
log.scrollTop=log.scrollHeight
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))
}

function setStatus(t){
status.innerHTML="● <b>"+escapeHtml(t)+"</b>"
}

async function ask(text){
text=text.trim();
if(!text)return;

add("user",text);
messages.push({role:"user",content:text});
input.value="";
send.disabled=true;
setStatus("DÜŞÜNÜYOR...");

try{
const r=await fetch("/.netlify/functions/chat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({messages:messages.slice(-20)})
});

const data=await r.json();

if(!r.ok)throw new Error(data.error||"Sunucu hatası");

const answer=data.answer||"Cevap alınamadı.";

messages.push({role:"assistant",content:answer});
add("assistant",answer);

if(speak.checked&&"speechSynthesis"in window){
speechSynthesis.cancel();
const u=new SpeechSynthesisUtterance(answer);
u.lang="tr-TR";
u.rate=.98;
speechSynthesis.speak(u)
}

setStatus("HAZIR")
}catch(e){
add("assistant","Bağlantı hatası: "+e.message);
setStatus("HATA")
}finally{
send.disabled=false;
input.focus()
}
}

send.onclick=()=>ask(input.value);

input.addEventListener("keydown",e=>{
if(e.key==="Enter")ask(input.value)
});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

if(SR){
recognition=new SR();
recognition.lang="tr-TR";
recognition.interimResults=false;
recognition.continuous=false;

recognition.onstart=()=>{
mic.textContent="🔴 Dinliyorum...";
setStatus("DİNLİYOR...")
};

recognition.onresult=e=>{
input.value=e.results[0][0].transcript;
ask(input.value)
};

recognition.onerror=()=>{
mic.textContent="🎙️ Mikrofonu Başlat";
setStatus("MİKROFON HATASI")
};

recognition.onend=()=>{
mic.textContent="🎙️ Mikrofonu Başlat";
if(status.textContent.includes("DİNLİYOR"))setStatus("HAZIR")
};

mic.onclick=()=>{
try{recognition.start()}catch(e){}
}
}else{
mic.disabled=true;
mic.textContent="🎙️ Bu tarayıcı sesli girişi desteklemiyor"
}
</script>
</body>
</html>
